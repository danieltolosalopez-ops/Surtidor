# Compila la app de Android en los servidores de GitHub (sin Android Studio ni ordenador propio).
# Resultado: en la pestaña "Releases" del repositorio aparece la versión "App Android" con:
#   - el .apk para instalarla directamente en tu móvil y probarla,
#   - el .aab para subirlo a Google Play (solo si has configurado la firma, ver README).
name: App Android

on:
  push:
    branches: [main]
    paths-ignore:            # los cambios de textos (README, registro) o de la ficha no recompilan la app
      - '**.md'
      - 'store/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Pruebas
        run: npm test

      - name: Copiar la librería del mapa (Leaflet)
        run: node scripts/vendor.mjs

      - name: Preparar el proyecto Android
        run: node scripts/android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Preparar la firma (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin firma configurada: se genera solo un APK de prueba. Para Google Play, sigue el README (apartado Firma)."
          fi

      - name: Compilar
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../salida
          if [ "$FIRMA" = "1" ]; then
            FIRMAR="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/firma.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KS_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
            ./gradlew --no-daemon assembleRelease bundleRelease $FIRMAR
            cp app/build/outputs/apk/release/app-release.apk "../salida/Surtidor.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../salida/Surtidor-google-play.aab"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../salida/Surtidor-prueba.apk"
          fi
          ls -la ../salida

      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: salida/

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android salida/* --title "App Android (última versión)" --latest \
            --notes "Compilada automáticamente a partir de ${GITHUB_SHA::7} (versión ${{ github.run_number }}). Para probarla, descarga el .apk desde el móvil y ábrelo. El .aab es el que se sube a Google Play."
